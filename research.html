<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aditi Mishra – Projects and Publications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Page background (sides) */
    html {
      height: 100%;
      background-color: #ffffff;
      background-image: url("images/blackhole.jpg"); /* same as index.html */
      background-repeat: repeat;
      background-size: cover;
    }

    /* Centered content area */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                   Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue",
                   Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem;
      line-height: 1.5;
      font-size: 18px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.8);
      box-sizing: border-box;
      min-height: 100vh;
    }

    header { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #005; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    h1 { margin-bottom: 0.2rem; font-size: 2.5rem; color: #000; }
    .subtitle { margin-top: 0; color: #555; }
    .columns { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1.5rem; justify-content: flex-end; }
    .col { flex: 1 1 220px; }
    img.portrait { max-width: 180px; height: auto; border-radius: 4px; margin-bottom: 0.5rem; }
    h3 { margin-bottom: 0.4rem; font-size: 1.5rem; color: #000; }
    ul { margin-top: 0.4rem; }
    h4 { color: #000; }

    @media (max-width: 600px) {
      body { padding: 1rem; }
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 1rem;
    }

    /* Dark mode: semi-transparent dark content background, dark page bg */
    .dark html {
      background-color: #000000 !important;
      background-image: none;
    }

    .dark body {
      color: #cccccc;
      background-color: rgba(40, 42, 54, 0.85) !important;
    }

    .dark h1, .dark h2, .dark h3, .dark h4 { color: #ffffff; }
    .dark .subtitle { color: #cccccc; }
    .dark nav a { color: #ffff00; }
    .dark button { background-color: #333; color: #fff; border: 1px solid #555; }
  </style>
</head>
<body>

<header>
  <h1>Aditi Mishra</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="cv.html">Education and Experience</a>
    <a href="research.html">Projects and Publications</a>
    <a href="personal.html">Personal</a>
  </nav>
</header>

<main>
  <h2>Projects and Publications</h2>
  <p>This page is under construction. A list of research interests, publications, and projects will be added soon.</p>
</main>

<script>
  // Check for saved theme preference
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.documentElement.classList.add('dark');
  }
</script>

</body>
</html>
